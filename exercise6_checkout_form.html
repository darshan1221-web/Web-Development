<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Content Delivery Network -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body>
    <!-- grid form checkout for online shoping application -->
     <div class="container">
    
                <div class="card">
                    <div class="card-header">
                        <h1>Cart Checkout</h1>
                    </div>
                    <card-body>
                    </card-body>

                </div>
                <div class="card mt-3">
                    <div class="card-header">
                        <h3>Shipping Address</h3>
                    </div>
                    <div class="card-body">
                        <form action="">
                            <div class="row">
                                 <div class="col-12 col-sm-6 col-md-4 col-lg-4">
                            <label for="" class="form-label">First Name</label>
                            <input type="text" class="form-control" required placeholder="enter your first name" />
                        </div>
                        <div class="col- col-sm-6 col-md-4 col-lg-4">
                            <label for="" class="form-label">Last Name</label>
                            <input type="text" class="form-control" required placeholder="enter your last name" />
                        </div> 
                         <div class="col-12 col-sm-6 col-md-4 col-lg-4">
                            <label for="" class="form-label">phone number</label>
                            <input type="tel" class="form-control" required placeholder="enter your phone number" />
                        </div>

                        <div class="row mt-3">
                            <div class="col- col-sm-6 col-md-4 col-lg-6">
                            <label for="" class="form-label">contry</label>
                            <input type="text" class="form-control" required placeholder="enter your country name" />
                        </div> 
                         <div class="col-12 col-sm-6 col-md-4 col-lg-6">
                            <label for="" class="form-label">address </label>
                            <input type="text" class="form-control" required placeholder="enter your adreess " />
                        </div>

                        <div class="row">
                            <div class="col-12 col-sm-6 col-md-4 col-lg-4">
                                <label for="" class="form-label">State</label>
                                <input type="text" class="form-control" required placeholder="enter your state name" />
                            </div>
                            <div class="col-12 col-sm-6 col-md-4 col-lg-4">
                                <label for="" class="form-label">city</label>
                                <input type="text" class="form-control" required placeholder="enter your city name" />
                            </div>
                            <div class="col-12 col-sm-6 col-md-4 col-lg-4">
                                <label for="" class="form-label">zipcode</label>
                                <input type="number" class="form-control" required placeholder="enter your zip code" />
                            </div>
                            
                           
                        </div>

                        </div>
                                </div>
                            </div>
                        </form>
                    </div>

                    <div class="card mt-3">
                        <div class="card-header">
                            <h3>Secure Payment</h3>
                        </div>
                        <div class="card-body">
                            <form action="">
                                <div class="row">
                                    <div class=" <div class="col-12 col-sm-6 col-md-4 col-lg-4">
                                        <label for="" class="form-label"> Card Type</label>
                                        <select class="form-select" required>
                                            <option value="" disabled selected>Select Card Type</option>
                                            <option value="visa">Visa</option>
                                            <option value="mastercard">MasterCard</option>
                                            <option value="amex">American Express</option>
                                            </select>
                                    </div>

                                    <div class="row">
                                    <div class="col-12 col-sm-6 col-md-4 col-lg-6">
                                <label for="" class="form-label">card number</label>
                                <input type="number" class="form-control" required placeholder="enter your card number" />
                            </div>
                            <div class="col-12 col-sm-6 col-md-4 col-lg-6">
                                <label for="" class="form-label">cvv</label>
                                <input type="number" class="form-control" required placeholder="enter your card cvv" />
                            </div>
                                </div>
                                <div class="row mt-3">
                                    <div class="col-12 col-sm-6 col-md-4 col-lg-6">
                                <label for="" class="form-label">Expire Date</label>
                                <input type="number" class="form-control" required placeholder="month" />
                            </div>
                            <div class="col-12 col-sm-6 col-md-4 col-lg-6">
                                <label for="" class="form-label"></label>
                                <input type="number" class="form-control" required placeholder="year" />
                            </div>
                                </div>
                                <div class="row mt-3 d-flex justify-content-end gap-2 ">
                                <div class="col-12 col-sm-6 col-md-4 col-lg-4 ">
                                    <button type="submit" class="btn btn-danger">Place Order</button>
                                <button type="submit" class="btn btn-secondary">Back To Home</button>
                                </div>
                                </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        
    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>
</html>
