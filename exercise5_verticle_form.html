<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Content Delivery Network -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body>
    <!-- create vertical form to open bank account  -->
     <div class="container mt-5">
        <div class="row">
            <div class="col-12">
                <div class="card shadow">
                    <div class="card-header text-center bg-success">
                        <h1>Open Bank Account</h1>
                    </div>
                    <div class="card-body ">
                        <form action="" >
                            <div class="mb-3 col-12 col-sm-12 col-md-12 col-lg-12">
                               <label for="full-name" class="form-label">Enter Your Full Name</label>
                                <input type="text" class="form-control " id="full-Name" placeholder="Enter your full name"> 
                            </div>
                            <div class="mb-3 col-12 col-sm-12 col-md-12 col-lg-12">
                                <label for="email" class="form-label">Enter Your Email</label>
                                <input type="email" class="form-control" id="email" placeholder="Enter your email">
                                </div>
                            <div class="mb-3 col-12 col-sm-12 col-md-12 col-lg-12">
                                <label for="phone" class="form-label">Enter Your Phone Number</label>
                                <input type="tel" class="form-control" id="phone" placeholder="Enter your phone number">
                            </div>  
                            <div class="mb-3 col-12 col-sm-12 col-md-12 col-lg-12">
                                <label for="address" class="form-label">Enter Your Address</label>
                                <input type="address" class="form-control" id="address" placeholder="Enter your address">
                                </div>
                            <div class="mb-3 col-12 col-sm-12 col-md-12 col-lg-12 ">
                                <label for="form label">Select Account Type :</label>
                                <div class="form-check form-check-inline">
                                     <input type="radio" name="account type" id="saving-account" value="1" class="form-check-input" />
                                <label for="saving-account" class="form-check-label">
                                    saving-account
                                </label>
                            </div>

                            <div class="form-check form-check-inline">
                                     <input type="radio" name="account type" id="current-account" value="1" class="form-check-input" />
                                <label for="current-account" class="form-check-label">
                                    cureent-account
                                </label>
                            </div>
                            <div class="form-check form-check-inline">
                                     <input type="radio" name="account type" id="salary-account" value="1" class="form-check-input" />
                                <label for="salary-account" class="form-check-label">
                                    salary-account
                                </label>
                            </div>
                            <div class="form-check form-check-inline">
                                     <input type="radio" name="account type" id="fixed-deposit-account" value="1" class="form-check-input" />
                                <label for="fixed-deposit-account" class="form-check-label">
                                    fixed-deposit-account
                                </label>
                            </div>
                            
                                </div>
                                
                                <div class="mb-3 col-12 col-sm-12 col-md-12 col-lg-12">
                                <label for="id-proof" class="form-label">upload your id-proof</label>
                                <input type="file" class="form-control" id="id-proof" placeholder="upload here">
                                </div>  
                                   
                <div class=" col-12 col-sm-12 col-md-12 col-lg-12 text-center d-flex justify-content-around">
                                    <button type="submit" class="btn btn-primary">Open Account</button>
                                    <button type="submit" class="btn btn-dark">clear all</button>
                                </div>
                                    
                        </form>
                    </div>
                </div>
            </div>
        </div>
     </div>
    
    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>
</html>
