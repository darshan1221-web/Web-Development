<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Content Delivery Network -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body>
    <!-- create horizontal form for forgot password  -->
     <div class="container mt-5 ">
        <div class="row">
            <div class="col-12">
                <div class="card shadow">
                    <div class="card-header bg-warning text-center ">
                        <h1>Reset Password </h1>
                    </div>
                    <div class="card-body">
                        <form action="">
                        
                            <div class="mb-3 col-12 col-sm-12 col-md-12 col-lg-12">
                                <label for="password" class="form-label">New Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Enter new password">
                            </div>
                            <div class="mb-3 col-12 col-sm-12 col-md-12 col-lg-12">
                                <label for="confirmPassword" class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm new password">
                            </div>
                            <div class=" d-flex justify-content-end gap-2 col-12 col-sm-12 col-md-12 col-lg-12"> 
                                 <button type="submit" class="btn btn-primary">Reset Password</button>
                            <button type="submit" class="btn btn-dark">clear all</button>
                            </div>

                           

                        </form>

                    </div>
                </div>

            </div>
        </div>
     </div>

    
    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>
</html>
